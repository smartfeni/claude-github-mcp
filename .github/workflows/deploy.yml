name: CI / Deploy

# Pull requests run the gate only (typecheck + tests). Pushes to main run the
# gate and then deploy to Cloudflare Workers if it passes. Secrets (GITHUB_PAT,
# CONNECTOR_PASSWORD) live in Cloudflare's secret store via `wrangler secret
# put`, NOT here — this workflow never sees them and does not manage them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid overlapping deploys if pushes land back-to-back.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: test
    # Only deploy on a real push to main, never on pull_request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
